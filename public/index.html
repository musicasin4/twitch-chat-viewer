<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twitch VOD Chat Viewer</title><link rel="stylesheet" href="/style.css"></head><body><div class="app">
<header class="top"><div class="brand"><div class="brand-dot"></div><div><strong>Twitch VOD Chat</strong><span>Visualizador de chat exportado</span></div></div></header>
<section id="landing" class="landing"><div class="logo-mark">▣</div><h1>Carregar chat do VOD</h1><p>Envie o CSV ou Excel gerado pelo Twitch VOD Chat Exporter. O tempo será apenas exibido no chat e não haverá redirecionamento para o VOD.</p><div class="upload-card"><label class="file-drop" id="drop"><input id="file" type="file" accept=".csv,.xlsx,.xls"><span class="upload-icon">↑</span><b id="fileName">Escolher arquivo CSV ou Excel</b><small>Arraste o arquivo aqui ou clique para selecionar</small></label><button id="load" class="primary">Carregar chat</button><div id="loadStatus" class="status"></div></div></section>
<section id="viewer" class="viewer hidden"><aside class="side"><div class="side-title">CHAT</div><div class="search"><input id="search" placeholder="Pesquisar usuário ou mensagem"><button id="clear">×</button></div><div class="filters"><button class="filter active" data-filter="all">Todas</button><button class="filter" data-filter="user">Usuários</button><button class="filter" data-filter="message">Mensagens</button></div><div id="stats" class="stats"></div></aside>
<main class="chat-panel"><div class="chat-head"><div><strong id="vodTitle">Chat</strong><small id="vodMeta"></small></div><div class="head-controls"><button id="timeMenu" class="control">Tempo ▾</button><button id="newFile" class="control">Outro arquivo</button></div><div id="timePanel" class="time-panel hidden"><label><input type="radio" name="mode" value="offset" checked> Tempo do VOD</label><label><input type="radio" name="mode" value="realTime"> Hora real</label><label><input type="radio" name="mode" value="realDateTime"> Data e hora reais</label></div></div><div id="chat" class="chat"></div><div id="empty" class="empty hidden">Nenhuma mensagem encontrada.</div></main></section></div><script src="/app.js"></script></body></html>
